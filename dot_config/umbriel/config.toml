# ==============================================================================
# General & Session Autostart
# ==============================================================================
[general]
mod_key = "Super"
xwayland = true
focus_on_activate = true
autostart = [
    "gnome-keyring-daemon --start --components=secrets",
    "noctalia",
]

# ==============================================================================
# Environment Variables
# ==============================================================================
[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_QPA_PLATFORM = "wayland"
QT_QPA_PLATFORMTHEME = "qt6ct"
QT_STYLE_OVERRIDE = ""
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
GTK_CSD = "0"

# ==============================================================================
# Outputs (Displays)
# ==============================================================================
[output."Samsung Electric Company LS32CG51x H9JWA00258"]
mode = "2560x1440@165"
position = [0, 0]
scale = 1.0
vrr = "fullscreen"
tearing = true
hdr = "on"
sdr_white = 300
bit_depth = 10

[output.HDMI-A-1]
mode = "1920x1080@60"
position = [2560, 0]
scale = 1.0

# ==============================================================================
# Input (Keyboard & Touchpad)
# ==============================================================================
[input.keyboard]
layout = "us,ir"
variant = ",pes"
options = "grp:lalt_lshift_toggle"
numlock_toggle = true

[input.focus]
follows_mouse = true

# ==============================================================================
# Layout & Appearance
# ==============================================================================
[layout]
mode = "scrolling"
gap = 0

[layout.scrolling]
default_extent_fraction = 0.5

[appearance]
prefer_no_csd = true
border_width = 0
outer_border_width = 0
corner_radius = 0

[appearance.blur]
enabled = false
optimized = true
passes = 3
radius = 5

[appearance.shadow]
enabled = false
softness = 10
offset_x = 2
offset_y = 2

# ==============================================================================
# Keybinds
# ==============================================================================
[keybinds]

# ─── Noctalia Shell & Plugins ───
"Mod"             = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+Space"       = { action = "spawn:noctalia msg panel-toggle control-center", repeat = false }
"Alt+V"           = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }
"Mod+V"           = { action = "spawn:noctalia msg plugin noctalia/screen_recorder:service all toggle focused", repeat = false }
"Mod+C"           = { action = "spawn:noctalia msg panel-toggle yuuto/calculator:panel", repeat = false }
"Mod+N"           = { action = "spawn:noctalia msg panel-toggle fel/quill:panel", repeat = false }
"Mod+P"           = { action = "spawn:noctalia msg panel-toggle tordex/processes:panel", repeat = false }
"Mod+M"           = { action = "spawn:noctalia msg plugin reza/mihomo-tun:tun-toggle all toggle", repeat = false }

# ─── Window Switcher (Alt+Tab) ───
"Alt+Tab"         = { action = "spawn:noctalia msg window-switcher hold", repeat = false }

# ─── Applications ───
"Mod+Return"      = { action = "spawn:kitty", repeat = false }
"Mod+B"           = { action = "spawn:firefox", repeat = false }
"Mod+X"           = { action = "spawn:zeditor", repeat = false }
"Mod+E"           = { action = "spawn:nautilus", repeat = false }

# ─── Screenshots (Pure Noctalia) ───
"Mod+Shift+S"     = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Print"           = { action = "spawn:noctalia msg screenshot-fullscreen", repeat = false }
"Shift+Print"     = { action = "spawn:noctalia msg screenshot-window", repeat = false }

# ─── Window Actions & Layout Modes ───
"Mod+Q"           = { action = "window-close", repeat = false }
"Mod+F"           = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Shift+F"     = { action = "window-toggle-fullscreen", repeat = false }
"Mod+T"           = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+V"     = { action = "window-focus-switch-floating", repeat = false }
"Mod+Tab"         = { action = "overview-toggle", repeat = false }

# ─── Window Navigation & Movement ───
"Mod+Left"        = "window-focus-left"
"Mod+Right"       = "window-focus-right"
"Mod+Up"          = "window-focus-up"
"Mod+Down"        = "window-focus-down"

"Mod+Ctrl+Left"   = "column-move-left"
"Mod+Ctrl+Right"  = "column-move-right"
"Mod+Ctrl+Up"     = "window-move-up"
"Mod+Ctrl+Down"   = "window-move-down"

"Mod+Home"        = "window-focus-left"
"Mod+End"         = "window-focus-right"
"Mod+Ctrl+Home"   = "column-move-to-first"
"Mod+Ctrl+End"    = "column-move-to-last"

# ─── Mouse Wheel Navigation (Replicated from Niri) ───
# Workspace switching via Wheel
"Mod+Shift+WheelDown"          = { action = "workspace-next", cooldown_ms = 150 }
"Mod+Shift+WheelUp"            = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown"           = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp"             = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }

# Column focus & movement via Wheel (Horizontal tilt & Vertical scroll)
"Mod+WheelRight"               = "window-focus-right"
"Mod+WheelLeft"                = "window-focus-left"
"Mod+Ctrl+WheelRight"          = "column-move-right"
"Mod+Ctrl+WheelLeft"           = "column-move-left"

"Mod+WheelDown"                = "window-focus-right"
"Mod+WheelUp"                  = "window-focus-left"
"Mod+Ctrl+Shift+WheelDown"     = "column-move-right"
"Mod+Ctrl+Shift+WheelUp"       = "column-move-left"

# ─── Consuming & Sizing ───
"Mod+BracketLeft"  = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+Comma"        = "window-consume-left"
"Mod+Period"       = "window-consume-right"

"Mod+R"            = "window-cycle-primary-extent"
"Mod+Shift+R"      = "window-cycle-primary-extent-back"
"Mod+Ctrl+C"       = "column-center"

"Mod+Minus"        = "window-modify-primary-extent:-0.1"
"Mod+Equal"        = "window-modify-primary-extent:0.1"
"Mod+Shift+Minus"  = "window-modify-secondary-extent:-0.1"
"Mod+Shift+Equal"  = "window-modify-secondary-extent:0.1"

# ─── Multi-Monitor Navigation ───
"Mod+Shift+Left"         = "output-focus-left"
"Mod+Shift+Right"        = "output-focus-right"
"Mod+Shift+Up"           = "output-focus-up"
"Mod+Shift+Down"         = "output-focus-down"

"Mod+Ctrl+Shift+Left"    = "window-move-to-output-left"
"Mod+Ctrl+Shift+Right"   = "window-move-to-output-right"
"Mod+Ctrl+Shift+Up"      = "window-move-to-output-up"
"Mod+Ctrl+Shift+Down"    = "window-move-to-output-down"

# ─── Workspaces (1 - 9) ───
"Mod+1"           = "workspace-switch:1"
"Mod+2"           = "workspace-switch:2"
"Mod+3"           = "workspace-switch:3"
"Mod+4"           = "workspace-switch:4"
"Mod+5"           = "workspace-switch:5"
"Mod+6"           = "workspace-switch:6"
"Mod+7"           = "workspace-switch:7"
"Mod+8"           = "workspace-switch:8"
"Mod+9"           = "workspace-switch:9"

"Mod+Ctrl+1"      = "window-move-to-workspace-silent:1"
"Mod+Ctrl+2"      = "window-move-to-workspace-silent:2"
"Mod+Ctrl+3"      = "window-move-to-workspace-silent:3"
"Mod+Ctrl+4"      = "window-move-to-workspace-silent:4"
"Mod+Ctrl+5"      = "window-move-to-workspace-silent:5"
"Mod+Ctrl+6"      = "window-move-to-workspace-silent:6"
"Mod+Ctrl+7"      = "window-move-to-workspace-silent:7"
"Mod+Ctrl+8"      = "window-move-to-workspace-silent:8"
"Mod+Ctrl+9"      = "window-move-to-workspace-silent:9"

"Mod+O"           = "workspace-previous"

# ─── Session & Inhibitor ───
"Mod+Escape"      = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Ctrl+Alt+Delete" = { action = "session-quit:skip-confirmation", repeat = false }
"Mod+Shift+P"     = "dpms-off"

[include.optional]
files = ["noctalia.toml"]
