system:
  disable_runtime: true
  env:
    AMD_VULKAN_ICD: RADV
    DISABLE_VULKAN_BSL_LAYER: '1'
    DXVK_HDR: '0'
    DXVK_STATE_CACHE: '1'
    ENABLE_LAYER_MESA_ANTI_LAG: '1'
    LOW_LATENCY_LAYER: '1'
    MESA_DISK_CACHE_SINGLE_FILE: '1'
    MESA_VK_ABORT_ON_ERROR: '0'
    PROTON_DLSS_INDICATOR: '0'
    PROTON_DLSS_UPGRADE: '1'
    PROTON_DXVK_LOWLATENCY: '1'
    PROTON_ENABLE_NGX_UPDATER: '1'
    PROTON_ENABLE_WAYLAND: '1'
    PROTON_FORCE_LARGE_ADDRESS_AWARE: '1'
    PROTON_FSR4_INDICATOR: '0'
    PROTON_FSR4_UPGRADE: '1'
    PROTON_HEAP_DELAY_FREE: '1'
    PROTON_LOCAL_SHADER_CACHE: '1'
    PROTON_NO_STEAMINPUT: '1'
    PROTON_NO_WM_DECORATION: '1'
    PROTON_PREFER_SDL: '1'
    PROTON_PRIORITY_HIGH: '1'
    PROTON_SET_GAME_DRIVE: '1'
    PROTON_SINGLE_WINDOW_SINGLE_INSTANCE: '1'
    PROTON_USE_EGL: '1'
    PROTON_USE_OPTISCALER: '1'
    PROTON_USE_PIPEWIRE: '1'
    PROTON_VERB: waitforexitandrun
    PROTON_XESS_UPGRADE: '1'
    RADV_PERFTEST: sam,cswave32,dccmsaa,gewave32
    RADV_TEX_ANISO: '16'
    STAGING_SHARED_MEMORY: '1'
    UMU_RUNTIME_UPDATE: '0'
    VKD3D_CONFIG: nodxr,no_upload_hvv,force_host_cached
    WINE_DISABLE_CSD: '1'
    WINE_DISABLE_FAST_ATTACH: '1'
    WINE_DISABLE_VULKAN_OPWR: '1'
    WINE_FULLSCREEN_INTEGER_SCALING: '1'
    WINE_MALLOC_PERF: '1'
    WINE_SERVER_HIGHPRIO: '1'
    XDG_CURRENT_DESKTOP: steamcompmgr
    all_proxy: socks5://127.0.0.1:7890
  mangohud: true
  prefix_command: game-performance
