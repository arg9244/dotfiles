[general]
import = [
    "~/.config/alacritty/themes/noctalia.toml"
]
live_config_reload = true

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[window]
# opacity = 0.90
# blur = true
decorations = "none"
padding = { x = 12, y = 12 }
dynamic_padding = true

[font]
size = 12.0
builtin_box_drawing = true

[font.normal]
family = "MesloLGS Nerd Font"
style = "Regular"

[font.bold]
family = "MesloLGS Nerd Font"
style = "Bold"

[font.italic]
family = "MesloLGS Nerd Font"
style = "Italic"

[font.bold_italic]
family = "MesloLGS Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

# [cursor]
# style = { shape = "Block", blinking = "On" }
# blink_interval = 500
# blink_timeout = 0
# vi_mode_style = { shape = "Beam", blinking = "On" }
# unfocused_hollow = true

[mouse]
hide_when_typing = true

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true
semantic_escape_chars = ",?`|:\"'()[]{}<>\t"

[bell]
animation = "EaseOut"
duration = 100
color = "#333333"

# --- KEYBOARD BINDINGS ---

# Paste with Ctrl + V
[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

# Scroll Up / Down with PageUp / PageDown
[[keyboard.bindings]]
key = "PageUp"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
action = "ScrollPageDown"

# Scroll to Top / Bottom with Shift + Home / Shift + End
[[keyboard.bindings]]
key = "Home"
mods = "Shift"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
action = "ScrollToBottom"

# Zoom In / Out / Reset (Ctrl + / Ctrl - / Ctrl 0)
[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

# Toggle Vi Mode (Ctrl + Shift + Space)
[[keyboard.bindings]]
key = "Space"
mods = "Control|Shift"
action = "ToggleViMode"

# Search Terminal Scrollback (Ctrl + Shift + F)
[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

# --- CLICKABLE LINKS ---

[[hints.enabled]]
command = "xdg-open" # Use "open" if you are on macOS
regex = "(ipfs:|claim:|file:|files:|https:|http:|ftp:|gemini:|gopher:)\\/\\/[^\\s\"'<>`]+"
hyperlinks = true
post_processing = true

[hints.enabled.mouse]
enabled = true
mods = "Control"
