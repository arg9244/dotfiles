[SystemSettings]
; ==============================================================================
; --- POST-PROCESSING & VISUAL CLEANUP ---
; ==============================================================================
r.MotionBlurQuality=0
r.MotionBlur.Max=0
r.DepthOfFieldQuality=0
r.DepthOfField.FarBlur=0
r.FastBlur=0
r.SceneColorFringeQuality=0
r.SceneColorFringe.Max=0
r.LensFlareQuality=0
r.BloomQuality=0
r.Bloom.DirtMaskIntensity=0
r.LightShaftQuality=0
r.Tonemapper.Quality=1
r.Tonemapper.GrainQuantization=0
r.VignetteQuality=0
r.VolumetricFog=0

; ==============================================================================
; --- LUMEN (GLOBAL ILLUMINATION & REFLECTIONS) ---
; ==============================================================================
r.Lumen.HardwareRayTracing=0
r.Lumen.AsyncCompute=1
r.Lumen.TranslucencyReflections.FrontLayer.Enable=0
r.Lumen.Reflections.MaxRoughnessToTrace=0.4
r.Lumen.SceneDetail=0.8
r.LumenScene.Radiosity.UpdateFactor=16

; ==============================================================================
; --- SHADOWS ---
; ==============================================================================
r.Shadow.DistanceScale=0.8
r.Shadow.CSM.MaxCascades=3
r.Shadow.Virtual.Cache=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5

; ==============================================================================
; --- MESH RENDERING & PIPELINE ---
; ==============================================================================
r.Nanite.MaxPixelsPerEdge=2.0
r.MeshDrawCommands.DynamicInstancing=1
r.MeshDrawCommands.UseCachedCommands=1

; ==============================================================================
; --- DRAW DISTANCE & LODS ---
; ==============================================================================
foliage.CullDistanceScale=0.75
r.ViewDistanceScale=0.85
r.StaticMeshLODDistanceScale=0.8

; ==============================================================================
; --- TEXTURES, STREAMING & MEMORY ---
; ==============================================================================
r.MaxAnisotropy=16
r.Streaming.PoolSize=8192
r.Streaming.MaxTempMemoryAllowed=512
r.VT.TilePoolSizeScale=1.5
r.VT.MaxUploadsPerFrameInMegabytes=8
