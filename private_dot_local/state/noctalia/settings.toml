config_version = 14

[bar.default]
center = [ "clock", "date", "weather", "media", "monitor", "procmon" ]
end = [ "mihomo-tun", "calculator", "todo", "notes", "clipboard", "notifications", "keyboard_layout", "session" ]
margin_edge = 0
margin_ends = 0
position = "bottom"
radius = 10
shadow = false
start = [ "tray", "workspaces", "taskbar" ]

[brightness]
sync_all_monitors = true

[calendar]
enabled = true
refresh_minutes = 240

    [calendar.account.personal_google]
    type = "google"

[control_center]
hidden_tabs = [ "power" ]

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

[location]
auto_locate = true

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
background_opacity = 0.89999997988343239
position = "bottom_right"

[plugin_settings."ahmedhossamdev/sticky-notes"]
no_colors = true
panel_layer = "overlay"
panel_placement = "floating"
panel_position = "center"
show_count = false

[plugin_settings."nightwatch75/todo"]
panel_layer = "overlay"
panel_placement = "floating"
panel_position = "center"

[plugin_settings."noctalia/screen_recorder"]
video_source = "portal"

[plugin_settings."nomadcxx/gamer-mode"]
poll_interval = "5"
profile = "heavy"

[plugin_settings."weinguyen/procmon"]
panel_placement = "attached"
refresh_interval = 3000
sort_by = "mem"

[plugin_settings."yuuto/calculator"]
panel_layer = "overlay"
panel_placement = "floating"
panel_position = "center"

[plugins]
enabled = [
    "ahmedhossamdev/sticky-notes",
    "apex077/eyecare",
    "noctalia/screen_recorder",
    "nomadcxx/gamer-mode",
    "reza/mihomo-tun",
    "weinguyen/procmon",
    "yuuto/calculator",
    "nightwatch75/todo"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/reza/.local/share/noctalia/plugins"
    name = "dev"

[shell]
avatar_path = "/home/reza/Pictures/Avatar.png"
clipboard_auto_paste = "off"
clipboard_keep_from_closed_apps = false
polkit_agent = true
screen_time_enabled = true
show_location = false

    [shell.launcher]
    fetch_exchange_rates = false

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    borders = false
    open_near_click_clipboard = true
    shadow = false

    [shell.screen_corners]
    enabled = true
    size = 30

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "~/Pictures/Screenshots"
    remember_last_region = true

[theme]
builtin = "Kanagawa"
community_palette = "Gruvbox Material"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    enable_builtin_templates = true

[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/reza/Pictures/Wallpapers/wallhaven-jevz8y.png"

[weather]
enabled = true
refresh_minutes = 240

[widget.calculator]
type = "yuuto/calculator:bar"

[widget.date]
format = "{:%a, %b %d}"
type = "clock"

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.mihomo-tun]
type = "reza/mihomo-tun:tun-toggle"

[widget.monitor]
highlight_gamer_mode = false
show_vram = true
type = "nomadcxx/gamer-mode:monitor"

[widget.notes]
type = "ahmedhossamdev/sticky-notes:bar"

[widget.procmon]
icon_only = true
type = "weinguyen/procmon:widget"

[widget.todo]
type = "nightwatch75/todo:todo"

[widget.weather]
show_condition = false

[widget.workspaces]
hide_when_empty = true